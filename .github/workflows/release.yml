name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish
        required: true
        default: v0.1
      version:
        description: Version embedded in the CLI binary and release notes
        required: true
        default: "0.1"

permissions:
  contents: write

jobs:
  go-assets:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            cgo: "0"
            asset: fabric-workspace-fs-linux-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            asset: fabric-workspace-fs-windows-amd64.exe
          - os: macos-14
            goos: darwin
            goarch: amd64
            cgo: "1"
            cc: clang -arch x86_64
            cgo_flags: -arch x86_64
            asset: fabric-workspace-fs-darwin-amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
            cgo: "1"
            cc: clang -arch arm64
            cgo_flags: -arch arm64
            asset: fabric-workspace-fs-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: true
      - name: Install macFUSE compile dependency
        if: matrix.goos == 'darwin'
        run: brew install macfuse
      - name: Build asset
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          CC: ${{ matrix.cc }}
          CGO_CFLAGS: ${{ matrix.cgo_flags }}
          CGO_LDFLAGS: ${{ matrix.cgo_flags }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${ASSET}" ./cmd/fabric-workspace-fs
          go version -m "dist/${ASSET}" | tee "dist/${ASSET}.buildinfo.txt"
          grep -q "build[[:space:]]CGO_ENABLED=${CGO_ENABLED}" "dist/${ASSET}.buildinfo.txt"
          grep -q "build[[:space:]]GOOS=${GOOS}" "dist/${ASSET}.buildinfo.txt"
          grep -q "build[[:space:]]GOARCH=${GOARCH}" "dist/${ASSET}.buildinfo.txt"
          grep -q "build[[:space:]]vcs.revision=${GITHUB_SHA}" "dist/${ASSET}.buildinfo.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.buildinfo.txt
          if-no-files-found: error

  python-assets:
    name: Build fabric-jupyter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Build package
        working-directory: python
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir ../dist-python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabric-jupyter
          path: dist-python/*
          if-no-files-found: error

  publish:
    name: Replace GitHub release assets
    runs-on: ubuntu-24.04
    needs: [go-assets, python-assets]
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<EOF
          ## What's included

          - Fabric Workspace FS ${VERSION} for Windows amd64, Linux amd64, macOS amd64, and macOS arm64.
          - \`fabric-jupyter\` Python package ${VERSION} in wheel and source distribution formats.
          - Root-level \`AGENTS.md\` guidance with the \`fabric-notebook-workflow\` skill.
          - Microsoft Learn MCP configuration in \`.mcp.json\`.
          - Notebook content files are exposed locally as \`{Notebook Name}.ipynb\`, while remote Fabric definition part paths remain unchanged.

          ## Installation

          ### Fabric Workspace FS

          1. Download the binary for your operating system from the assets below.
          2. Rename it to \`fabric-workspace-fs\` (or keep the \`.exe\` suffix on Windows).
          3. Make it executable on Unix-like systems and place it in a directory on your \`PATH\`.

          Example on Linux or macOS:

          \`\`\`bash
          chmod +x fabric-workspace-fs-linux-amd64
          sudo mv fabric-workspace-fs-linux-amd64 /usr/local/bin/fabric-workspace-fs
          \`\`\`

          On macOS, install and approve macFUSE first. The macOS assets are built with CGO enabled and require macFUSE at runtime.

          On Windows, place \`fabric-workspace-fs-windows-amd64.exe\` in a directory on \`PATH\`, then run it from PowerShell or Command Prompt.

          ### fabric-jupyter

          Install the wheel with:

          \`\`\`bash
          python -m pip install fabric_jupyter-${VERSION}-py3-none-any.whl
          \`\`\`

          Alternatively, install from the source distribution:

          \`\`\`bash
          python -m pip install fabric_jupyter-${VERSION}.tar.gz
          \`\`\`

          See the repository README and documentation for authentication, mounting, and Notebook workflow details.
          EOF
          if ! gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${REPO}" --verify-tag --title "${TAG}" --notes-file RELEASE_NOTES.md
          else
            gh release edit "${TAG}" --repo "${REPO}" --title "${TAG}" --notes-file RELEASE_NOTES.md --draft=false --prerelease=false
          fi
          mapfile -t assets < <(find release-assets -type f ! -name '*.buildinfo.txt' | sort)
          expected_names="$(mktemp)"
          for asset in "${assets[@]}"; do
            basename "${asset}" >> "${expected_names}"
          done
          gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[].name' |
            while IFS= read -r existing; do
              if ! grep -Fxq "${existing}" "${expected_names}"; then
                gh release delete-asset "${TAG}" "${existing}" --repo "${REPO}" --yes
              fi
            done
          gh release upload "${TAG}" --repo "${REPO}" --clobber "${assets[@]}"
