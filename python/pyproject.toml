[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fabric-jupyter"
version = "0.2.1"
description = "Local Jupyter kernel and broker boundary for Microsoft Fabric"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RobinLin666" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "ipykernel>=6.29,<7",
  "jupyter_client>=8.6,<9",
  "jupyter_core>=5.7,<6",
  "pyzmq>=25.1,<28",
  "azure-identity>=1.23,<2",
  "httpx>=0.28,<0.29",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
fabric-jupyter = "fabric_jupyter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric_jupyter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fabric_jupyter"]
disallow_untyped_calls = false
